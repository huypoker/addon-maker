<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css">
<title>Addon Maker Moderation</title>
<style>
main{max-width:960px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
button{font:400 20px/1 "Jersey 10",monospace;letter-spacing:.04em;padding:10px 16px;border:3px solid #3a3444;background:var(--surface);color:var(--text);cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button.go{background:var(--accent);color:#062A14;border-color:#1E8A4C}
button.stop{background:#E5484D;color:#fff;border-color:#8f2427}
.tabs{display:flex;flex-wrap:wrap;gap:0;margin:16px 0}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#2B1D00;border-color:#B08420}
.count{font:14px "Noto Sans",sans-serif;color:inherit;opacity:.8;margin-left:6px}
.post{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
@media (max-width:640px){.post{grid-template-columns:1fr}}
.post h2{margin:0 0 4px;color:var(--text)}
.meta{font-size:14px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.meta code{color:var(--muted);font-size:12px}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.reason{font-size:13px;padding:2px 8px;background:#2A1618;color:#ffb3b5;border:1px solid #5a2a2d}
.preview{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.preview figure{margin:0;display:grid;gap:4px;justify-items:start}
.preview figcaption{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
canvas{image-rendering:pixelated;background:repeating-conic-gradient(#3a3444 0 25%,#2e2840 0 50%) 0 0/12px 12px;border:2px solid #0C0A10}
.swatch{display:inline-block;width:28px;height:28px;border:2px solid #0C0A10;vertical-align:middle}
.actions{display:flex;flex-direction:column;gap:8px;min-width:150px}
@media (max-width:640px){.actions{flex-direction:row;flex-wrap:wrap}}
.empty{color:var(--muted);text-align:center;padding:32px 16px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface);border:3px solid var(--accent);padding:10px 16px;max-width:calc(100% - 32px)}
.toast.error{border-color:#E5484D}
dialog{background:var(--surface);color:var(--text);border:3px solid #3a3444;padding:20px;max-width:min(440px,calc(100% - 32px))}
dialog::backdrop{background:rgba(8,6,11,.75)}
dialog h2{margin:0 0 8px;color:var(--text)}
dialog p{margin:0 0 16px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
</style></head><body><main>
<div class="bar"><h1>Community moderation</h1><div id="who" class="muted"></div></div>
<p class="muted">Posts from the Addon Maker Community tab. Nothing appears in the app until it is approved here. The app promises that reports are handled within 24 hours.</p>

<section id="signed-out" class="card" hidden>
<p>Sign in with the Google account that is on the moderator list.</p>
<button id="sign-in" class="go" type="button">Sign in with Google</button>
<p id="sign-in-error" class="muted" hidden></p>
</section>

<section id="signed-in" hidden>
<div class="bar">
<div class="tabs" role="group" aria-label="Which posts">
<button id="tab-pending" type="button" aria-pressed="true">Waiting for review<span class="count" id="count-pending"></span></button>
<button id="tab-reports" type="button" aria-pressed="false">Reported<span class="count" id="count-reports"></span></button>
<button id="tab-published" type="button" aria-pressed="false">Published<span class="count" id="count-published"></span></button>
</div>
<div style="display:flex;gap:8px"><button id="refresh" type="button">Refresh</button><button id="sign-out" type="button">Sign out</button></div>
</div>
<div id="list"></div>
</section>
<div id="toast" class="toast" hidden role="status"></div>
<dialog id="confirm" aria-labelledby="confirm-title">
<h2 id="confirm-title"></h2>
<p id="confirm-text"></p>
<div class="row"><button id="confirm-cancel" type="button">Cancel</button><button id="confirm-ok" class="stop" type="button"></button></div>
</dialog>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-functions.js";

// Public web config of the shared project selenderman-2511. Access is decided
// by the bsMod… functions, which only answer moderators.
const app = initializeApp({
  apiKey: "AIzaSyAjKXn0BHwg-n4WMQxFN8tPsb9IwlLzqOk",
  authDomain: "selenderman-2511.firebaseapp.com",
  projectId: "selenderman-2511",
});
const auth = getAuth(app);
const functions = getFunctions(app, "us-central1");
const modPosts = httpsCallable(functions, "bsModPosts");
const modAction = httpsCallable(functions, "bsModAction");

const $ = (id) => document.getElementById(id);
let view = "pending";

const REASONS = { unkind: "Unkind", not_for_kids: "Not for kids", copied: "Copied", spam: "Spam" };
const KINDS = { skin: "Skin", addon: "Addon", texturePack: "Texture pack", structure: "Structure" };
const BLOCKS = { stone: 0xff7d7d84, planks: 0xffa0703f, glass: 0xffcfe8f2, leaves: 0xff3e7a34 };
// Stat names from the app's addon_template.dart.
const ADDON_VALUES = { weapon: ["Damage", "Durability"], pet: ["Health", "Speed"], food: ["Nutrition", "Saturation"], block: ["Hardness", "Light"], tool: ["Mining speed", "Durability"] };
// Template icons, used when the author did not draw their own: 1 main, 2 accent.
const ADDON_ICONS = {
  weapon: ["......11", ".....121", "....121.", "...121..", "2.121...", ".22.....", ".22.....", "2..2...."],
  pet: ["........", ".11..11.", ".111111.", "11211211", "11111111", ".111111.", ".1.11.1.", "........"],
  food: ["....2...", "...2....", ".111111.", "11111111", "11111111", "11111111", ".111111.", "..1111.."],
  block: ["11111111", "12111121", "11112111", "11211111", "11111211", "12111111", "11112121", "11111111"],
  tool: [".111111.", "11.22.11", "1..22..1", "...22...", "...22...", "...22...", "...22...", "...22..."],
};
// Names from AddonAbility and CraftItem in addon_template.dart.
const ABILITY_LABELS = { freeze: "Freeze", poison: "Poison", fire: "Fire", launch: "Launch", speed: "Speed", jump: "Jump", nightVision: "Night vision", healing: "Healing", waterBreathing: "Water breathing", guard: "Guard", fireproof: "Fireproof", swimmer: "Swimmer", rush: "Rush", lantern: "Lantern", blastProof: "Blast-proof", seeThrough: "See-through", burns: "Burns" };
const craftLabel = (name) => name.replace(/([A-Z])/g, " $1").toLowerCase();

function toast(text, error = false) {
  const t = $("toast");
  t.textContent = text;
  t.className = "toast" + (error ? " error" : "");
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.hidden = true), 4000);
}

const message = (e) =>
  e?.code === "functions/permission-denied" ? "This Google account is not on the moderator list."
  : e?.code === "functions/not-found" ? "This post no longer exists."
  : e?.message || "Something went wrong. Try again.";

// A canvas with cells of 32-bit ARGB colours; null or transparent is empty.
function canvas(cells, size, scale, label) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  c.style.width = c.style.height = size * scale + "px";
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(size, size);
  cells.forEach((argb, i) => {
    if (argb == null || argb >>> 24 === 0) return;
    img.data.set([(argb >>> 16) & 255, (argb >>> 8) & 255, argb & 255, argb >>> 24], i * 4);
  });
  ctx.putImageData(img, 0, 0);
  const fig = document.createElement("figure");
  fig.append(c);
  if (label) {
    const cap = document.createElement("figcaption");
    cap.textContent = label;
    fig.append(cap);
  }
  return fig;
}

function preview(post) {
  const box = document.createElement("div");
  box.className = "preview";
  const { kind, data } = post;
  try {
    if (kind === "skin") {
      // 64×64 pixels, four bytes each: A, R, G, B (skin_texture.dart).
      const bytes = Uint8Array.from(atob(data.pixels), (ch) => ch.charCodeAt(0));
      const cells = [];
      for (let i = 0; i < bytes.length; i += 4) {
        cells.push(((bytes[i] << 24) | (bytes[i + 1] << 16) | (bytes[i + 2] << 8) | bytes[i + 3]) >>> 0);
      }
      box.append(canvas(cells, 64, 4, "skin texture"));
    } else if (kind === "texturePack") {
      for (const [slot, grid] of Object.entries(data.edits)) box.append(canvas(grid, 8, 10, slot));
    } else if (kind === "structure") {
      data.layers.forEach((layer, i) => box.append(canvas(layer.map((b) => (b ? BLOCKS[b] : null)), 8, 10, `layer ${i + 1}`)));
    } else if (kind === "addon") {
      const labels = ADDON_VALUES[data.template] ?? ["Value 1", "Value 2"];
      const rows = data.icon ?? ADDON_ICONS[data.template];
      if (rows) {
        const cells = rows.join("").split("").map((ch) => (ch === "1" ? data.mainColour : ch === "2" ? data.accentColour : null));
        box.append(canvas(cells, 8, 10, data.icon ? "drawn icon" : "template icon"));
      }
      const info = document.createElement("div");
      info.style.display = "grid";
      info.style.gap = "6px";
      const p = document.createElement("p");
      p.style.margin = "0";
      const hex = (argb) => "#" + (argb & 0xffffff).toString(16).padStart(6, "0");
      p.innerHTML = `<b></b> · <span></span> <span class="swatch" style="background:${hex(data.mainColour)}" title="Main colour"></span> <span class="swatch" style="background:${hex(data.accentColour)}" title="Accent colour"></span>`;
      p.querySelector("b").textContent = data.template;
      p.querySelector("span").textContent = data.values.map((v, i) => `${labels[i]} ${v}`).join(", ");
      info.append(p);
      const line = (label, text) => {
        const row = document.createElement("p");
        row.style.margin = "0";
        row.style.color = "var(--muted)";
        row.textContent = `${label}: ${text}`;
        info.append(row);
      };
      line("Power", data.ability ? ABILITY_LABELS[data.ability] ?? data.ability : "none");
      if (data.template === "pet") {
        line("Tamed with", craftLabel(data.tame ?? "bone"));
      } else if (data.recipe) {
        const grid = [0, 1, 2].map((r) => data.recipe.slice(r * 3, r * 3 + 3).map((c) => (c ? craftLabel(c) : "·")).join(" | "));
        line("Recipe", grid.join("  /  "));
      } else {
        line("Recipe", "not craftable");
      }
      box.append(info);
    }
  } catch {
    box.textContent = "This creation could not be drawn.";
  }
  return box;
}

// Actions that cannot be undone from this page ask first.
const CONFIRM = {
  reject: (p) => ["Reject this post?", `“${p.title}” will never appear in the app. Its author sees “Not approved”.`, "Reject"],
  remove: (p) => ["Remove this post?", `“${p.title}” disappears from the app for everyone and its reports are closed.`, "Remove"],
  ban: (p) => [`Ban ${p.handle}?`, `${p.handle} can no longer share, and all of their posts are removed from the app, not only “${p.title}”.`, "Ban author"],
};

function confirmAction(action, post) {
  const ask = CONFIRM[action];
  if (!ask) return Promise.resolve(true);
  const [title, text, ok] = ask(post);
  const dialog = $("confirm");
  $("confirm-title").textContent = title;
  $("confirm-text").textContent = text;
  $("confirm-ok").textContent = ok;
  return new Promise((resolve) => {
    const done = (answer) => {
      $("confirm-ok").onclick = $("confirm-cancel").onclick = dialog.oncancel = null;
      dialog.close();
      resolve(answer);
    };
    $("confirm-ok").onclick = () => done(true);
    $("confirm-cancel").onclick = () => done(false);
    dialog.oncancel = (e) => { e.preventDefault(); done(false); };
    dialog.showModal();
    $("confirm-cancel").focus();
  });
}

function actionButton(label, cls, action, post, card) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  if (cls) b.className = cls;
  b.addEventListener("click", async () => {
    if (!(await confirmAction(action, post))) return;
    card.querySelectorAll("button").forEach((x) => (x.disabled = true));
    try {
      const { data } = await modAction({ action, postId: post.id });
      card.remove();
      const done = { approve: "Approved. It now shows in the app.", reject: "Rejected. The author sees “not approved”.", remove: "Removed from the app.", keep: "Kept. Reports closed.", ban: `Author banned, ${data.postsRemoved} posts removed.` };
      toast(done[action]);
      load(false);
    } catch (e) {
      toast(message(e), true);
      card.querySelectorAll("button").forEach((x) => (x.disabled = false));
    }
  });
  return b;
}

function card(post) {
  const el = document.createElement("article");
  el.className = "card post";
  const body = document.createElement("div");
  body.style.minWidth = "0";
  const h = document.createElement("h2");
  h.textContent = post.title;
  const meta = document.createElement("div");
  meta.className = "meta";
  const when = post.createdAt ? new Date(post.createdAt).toLocaleString() : "";
  for (const text of [KINDS[post.kind] ?? post.kind, post.handle, when, post.reports ? `${post.reports} ${post.reports === 1 ? "report" : "reports"}` : ""]) {
    if (!text) continue;
    const s = document.createElement("span");
    s.textContent = text;
    meta.append(s);
  }
  const id = document.createElement("code");
  id.textContent = post.id;
  meta.append(id);
  body.append(h, meta);
  if (post.reasons) {
    const r = document.createElement("div");
    r.className = "reasons";
    for (const reason of post.reasons) {
      const s = document.createElement("span");
      s.className = "reason";
      s.textContent = REASONS[reason] ?? reason;
      r.append(s);
    }
    body.append(r);
  }
  body.append(preview(post));

  const actions = document.createElement("div");
  actions.className = "actions";
  if (view === "pending") {
    actions.append(actionButton("Approve", "go", "approve", post, el), actionButton("Reject", "", "reject", post, el));
  } else if (view === "reports") {
    actions.append(actionButton("Remove", "stop", "remove", post, el), actionButton("Keep", "go", "keep", post, el));
  } else {
    actions.append(actionButton("Remove", "stop", "remove", post, el));
  }
  actions.append(actionButton("Ban author", "", "ban", post, el));
  el.append(body, actions);
  return el;
}

async function count(which) {
  const { data } = await modPosts({ view: which });
  $(`count-${which}`).textContent = data.posts.length ? `(${data.posts.length})` : "";
  return data.posts;
}

async function load(showLoading = true) {
  const list = $("list");
  if (showLoading) list.innerHTML = '<p class="empty">Loading posts…</p>';
  try {
    const [pending, reports, published] = await Promise.all([count("pending"), count("reports"), count("published")]);
    const posts = { pending, reports, published }[view];
    list.replaceChildren(...posts.map(card));
    if (!posts.length) {
      const empty = { pending: "No posts are waiting for review.", reports: "No open reports.", published: "Nothing is showing in the app yet." };
      list.innerHTML = `<p class="empty">${empty[view]}</p>`;
    }
  } catch (e) {
    list.innerHTML = "";
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = message(e);
    list.append(p);
  }
}

function setView(next) {
  view = next;
  for (const tab of ["pending", "reports", "published"]) $(`tab-${tab}`).setAttribute("aria-pressed", next === tab);
  load();
}

$("tab-pending").addEventListener("click", () => setView("pending"));
$("tab-reports").addEventListener("click", () => setView("reports"));
$("tab-published").addEventListener("click", () => setView("published"));
$("refresh").addEventListener("click", () => load());
$("sign-out").addEventListener("click", () => signOut(auth));
$("sign-in").addEventListener("click", async () => {
  $("sign-in-error").hidden = true;
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    $("sign-in-error").textContent =
      e.code === "auth/unauthorized-domain"
        ? "This site is not yet allowed to sign in. Add huypoker.github.io under Authentication › Settings › Authorized domains in the Firebase console."
        : e.code === "auth/popup-closed-by-user" ? "Sign-in was cancelled." : e.message;
    $("sign-in-error").hidden = false;
  }
});

onAuthStateChanged(auth, (user) => {
  // An anonymous session is never a moderator; only Google accounts count.
  const signedIn = !!user && !user.isAnonymous;
  $("signed-out").hidden = signedIn;
  $("signed-in").hidden = !signedIn;
  $("who").textContent = signedIn ? `Signed in as ${user.email}` : "";
  if (signedIn) load();
});
</script>
</body></html>
